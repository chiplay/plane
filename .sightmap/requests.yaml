version: 1
requests:
  - name: ListProjectIssues
    route: /api/workspaces/:slug/projects/:projectId/issues
    method: GET
    description: Fetch work items for a project
    source: apps/api/plane/app/views/issue/base.py
    response:
      fields:
        - name: results
          type: array
  - name: UpdateIssue
    route: /api/workspaces/:slug/projects/:projectId/issues/:issueId
    method: PATCH
    description: Partial update of a work item (state changes post here)
  - name: AnyPlaneAPI
    route: /api/**
    description: catch-all test
